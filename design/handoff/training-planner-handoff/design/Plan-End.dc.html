<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>End plan</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tp.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="app" data-theme="{{theme}}" style="width: 390px; height: 844px">
  <div style="position: absolute; inset: 0">
    <dc-import name="Plans" theme="{{theme}}" hint-size="390px,844px"></dc-import>
  </div>
  <div class="scrim"></div>
  <div class="sheet" role="alertdialog" aria-label="End plan">
    <div class="grab"></div>
    <div class="r">
      <div class="grow col g4"><h2 style="font-size: 21px; font-weight: 700">End “Autumn base”?</h2><span class="sm muted">Open-ended · week 5</span></div>
      <a class="ib" href="Plans.dc.html" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    </div>
    <div class="seg">
      <button class="on" aria-pressed="true">Today · Thu 22 Oct</button>
      <button>Pick a date</button>
    </div>
    <div class="col g8">
      <div class="r g12" style="align-items: flex-start"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true" style="margin-top: 2px"><path d="M5 12.5l4.5 4.5L19 7"/></svg><span><b>Kept:</b> every completed workout and your edited values stay in the calendar.</span></div>
      <div class="r g12" style="align-items: flex-start"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true" style="margin-top: 2px"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg><span><b>Removed:</b> all drafts after Thu 22 Oct, including 4 still open this week.</span></div>
    </div>
    <div class="banner info" style="align-items: center">
      <svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      <span>An ended plan can’t be restarted, but you can duplicate it as a new plan.</span>
    </div>
    <div class="col g8">
      <button class="btn d blk">End plan</button>
      <a class="btn blk" href="Plans.dc.html">Keep plan</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'light' }; }
}
</script>
</body>
</html>
